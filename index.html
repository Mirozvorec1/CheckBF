<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CheckBF</title>
    <script src="lib/firebase-app-compat.js"></script>
    <script src="lib/firebase-auth-compat.js"></script>
    <script src="lib/firebase-firestore-compat.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
        }
        body {
            min-height: 100vh;
            background-color: #1a1a1a;
            background-image: url('assets/background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #c900c9;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.3s;
        }
        body.gradient-bg {
            background: linear-gradient(135deg, #0a0a0a 0%, #2d1b4e 30%, #1a0a2e 60%, #0a0a0a 100%);
        }
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle ease-in-out infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.1; transform: translateY(0); }
            50% { opacity: 0.8; transform: translateY(-20px); }
        }
        h1 {
            font-size: 4rem;
            -webkit-text-stroke: 1px #000;
        }
        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 2px solid #555;
            object-fit: cover;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }
        .grid {
            position: relative;
            width: 100%;
            max-width: 1000px;
            min-height: 600px;
        }
        .oval {
            position: absolute;
            border-radius: 50%;
            background: #2a2a3a;
            border: 1px solid #555;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
        }
        .oval:hover {
            background: #33334a;
        }
        .oval.dim {
            background: #1f1f2a;
            border-color: #3a3a4a;
            opacity: 0.5;
        }
        .oval.dim:hover {
            background: #252535;
            opacity: 0.7;
        }
        .oval h2 {
            font-size: 1.1rem;
            color: #8cf;
            margin: 0;
            -webkit-text-stroke: 0.5px #000;
            letter-spacing: 0.5px;
        }
        .oval p {
            font-size: 0.8rem;
            color: #999;
            line-height: 1.3;
        }
        .o1 { width: 220px; height: 120px; top: 2%; left: 3%; }
        .o6 { width: 180px; height: 100px; top: 2%; left: 28%; }
        .o2 { width: 200px; height: 100px; top: 2%; right: 3%; }
        .o3 { width: 240px; height: 130px; top: 42%; left: 3%; }
        .o4 { width: 200px; height: 100px; top: 42%; right: 3%; }
        .o5 { width: 220px; height: 120px; bottom: 5%; left: 35%; }
        svg.arrows {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
        .auth-bar {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .auth-bar .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #2a2a3a;
            border: 1px solid #555;
            border-radius: 10px;
            padding: 6px 14px;
            color: #ccc;
            font-size: 0.8rem;
        }
        .auth-bar .user-info img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
        }
        .auth-bar .user-info .email {
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .auth-bar .logout-btn {
            background: none;
            border: 1px solid #c62828;
            color: #c62828;
            border-radius: 6px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 0.75rem;
        }
        .auth-bar .logout-btn:hover {
            background: #c62828;
            color: #fff;
        }
        .auth-bar .login-btn {
            background: #2a2a3a;
            border: 1px solid #555;
            border-radius: 10px;
            padding: 8px 18px;
            color: #8cf;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .auth-bar .login-btn:hover {
            background: #33334a;
            border-color: #8cf;
        }
        .auth-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 50;
            justify-content: center;
            align-items: center;
        }
        .auth-overlay.active {
            display: flex;
        }
        .auth-modal {
            background: #1e1e2e;
            border: 1px solid #555;
            border-radius: 16px;
            padding: 30px;
            width: 340px;
            text-align: center;
        }
        .auth-modal h2 {
            color: #8cf;
            margin: 0 0 20px;
            font-size: 1.3rem;
        }
        .auth-modal input {
            width: 100%;
            padding: 10px 14px;
            margin-bottom: 12px;
            border: 1px solid #555;
            border-radius: 8px;
            background: #2a2a3a;
            color: #fff;
            font-size: 0.9rem;
            box-sizing: border-box;
        }
        .auth-modal input:focus {
            outline: none;
            border-color: #8cf;
        }
        .auth-modal .auth-submit {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #5c6bc0;
            color: #fff;
            font-size: 0.9rem;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .auth-modal .auth-submit:hover {
            background: #7986cb;
        }
        .auth-modal .google-btn {
            width: 100%;
            padding: 10px;
            border: 1px solid #555;
            border-radius: 8px;
            background: #2a2a3a;
            color: #ccc;
            font-size: 0.9rem;
            cursor: pointer;
            margin-bottom: 12px;
        }
        .auth-modal .google-btn:hover {
            background: #33334a;
            border-color: #8cf;
        }
        .auth-modal .switch-link {
            color: #8cf;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .auth-modal .error-msg {
            color: #c62828;
            font-size: 0.8rem;
            margin-bottom: 10px;
            min-height: 1.2em;
        }
        .sync-indicator {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2a2a3a;
            border: 1px solid #43a047;
            border-radius: 10px;
            padding: 8px 14px;
            color: #43a047;
            font-size: 0.75rem;
            z-index: 30;
            transition: opacity 0.3s;
        }
        .sync-indicator.active {
            display: block;
        }
        .roblox-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 50;
            justify-content: center;
            align-items: center;
        }
        .roblox-overlay.active {
            display: flex;
        }
        .roblox-modal {
            background: #1e1e2e;
            border: 1px solid #555;
            border-radius: 16px;
            padding: 30px;
            width: 340px;
            text-align: center;
        }
        .roblox-modal h2 {
            color: #8cf;
            margin: 0 0 10px;
            font-size: 1.3rem;
        }
        .roblox-modal input {
            width: 100%;
            padding: 10px 14px;
            margin-bottom: 12px;
            border: 1px solid #555;
            border-radius: 8px;
            background: #2a2a3a;
            color: #fff;
            font-size: 0.9rem;
            box-sizing: border-box;
        }
        .roblox-modal input:focus {
            outline: none;
            border-color: #8cf;
        }
        .roblox-modal .auth-submit {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #5c6bc0;
            color: #fff;
            font-size: 0.9rem;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .roblox-modal .auth-submit:hover {
            background: #7986cb;
        }
        .avatar {
            cursor: pointer;
        }
    </style>
</head>
<body class="gradient-bg">
    <div class="particles" id="particles"></div>
    <div class="auth-bar" id="authBar">
        <button class="login-btn" id="loginBtn" onclick="openAuthModal()">Войти</button>
    </div>
    <div class="auth-overlay" id="authOverlay">
        <div class="auth-modal">
            <h2 id="authTitle">Вход</h2>
            <div class="error-msg" id="authError"></div>
            <input type="email" id="authEmail" placeholder="Email" autocomplete="off">
            <input type="password" id="authPass" placeholder="Пароль" autocomplete="new-password">
            <button class="auth-submit" id="authSubmit" onclick="handleAuth()">Войти</button>
            <button class="google-btn" onclick="handleGoogleAuth()">Войти через Google</button>
            <span class="switch-link" id="authSwitch" onclick="toggleAuthMode()">Нет аккаунта? Регистрация</span>
            <br><br>
            <span class="switch-link" onclick="closeAuthModal()">Позже</span>
        </div>
    </div>
    <div class="sync-indicator" id="syncIndicator">Синхронизация...</div>
    <svg class="arrows" id="arrows"></svg>
    <img class="avatar" id="avatar" src="https://tr.rbxcdn.com/30DAY-AvatarHeadshot-1507DAB190B8A3C9CEA7A26EE1A69D31-Png/420/420/AvatarHeadshot/Png/noFilter" alt="Avatar" onclick="openRobloxModal()">
    <div class="roblox-overlay" id="robloxOverlay">
        <div class="roblox-modal">
            <h2>Roblox Профиль</h2>
            <p style="color:#aaa;font-size:0.8rem;margin:0 0 15px;">Введите имя профиля Roblox для отображения аватара</p>
            <input type="text" id="robloxIdInput" placeholder="Имя профиля Roblox" maxlength="30" autocomplete="off">
            <button class="auth-submit" onclick="saveRobloxId()">Сохранить</button>
            <span class="switch-link" onclick="closeRobloxModal()">Отмена</span>
        </div>
    </div>
    <h1>CheckBF</h1>
    <div class="grid">
        <div class="oval o1" onclick="location.href='fruit.html'">
            <h2>Фрукты</h2>
        </div>
        <div class="oval o2 dim">
            <h2>Мечи</h2>
        </div>
        <div class="oval o3" onclick="location.href='fightingstyles.html'">
            <h2>Стили боя</h2>
        </div>
        <div class="oval o4 dim">
            <h2>Оружие</h2>
        </div>
        <div class="oval o5 dim">
            <h2>Аксессуары</h2>
        </div>
        <div class="oval o6" onclick="location.href='skins.html'">
            <h2>Скины</h2>
        </div>
    </div>
    <script>
        function drawArrows() {
            var svg = document.getElementById('arrows');
            var avatar = document.getElementById('avatar');
            var avRect = avatar.getBoundingClientRect();
            var cx = avRect.left + avRect.width / 2;
            var cy = avRect.top + avRect.height / 2;

            var o1 = document.querySelector('.o1');
            var o2 = document.querySelector('.o2');
            var o3 = document.querySelector('.o3');
            var o4 = document.querySelector('.o4');
            var o5 = document.querySelector('.o5');
            var o6 = document.querySelector('.o6');
            var r1 = o1.getBoundingClientRect();
            var r2 = o2.getBoundingClientRect();
            var r3 = o3.getBoundingClientRect();
            var r4 = o4.getBoundingClientRect();
            var r5 = o5.getBoundingClientRect();
            var r6 = o6.getBoundingClientRect();

            var lines = '';
            var defs = '<defs><marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#fff"/></marker></defs>';

            function arrowFromTo(x1, y1, x2, y2, el1, el2, width, opacity) {
                var dx = x2 - x1;
                var dy = y2 - y1;
                var len = Math.sqrt(dx * dx + dy * dy);
                if (len === 0) return;
                var ux = dx / len;
                var uy = dy / len;
                var sx = x1 + ux * (el1.width / 2 + 2);
                var sy = y1 + uy * (el1.height / 2 + 2);
                var ex = x2 - ux * (el2.width / 2 + 2);
                var ey = y2 - uy * (el2.height / 2 + 2);
                lines += '<line x1="' + sx + '" y1="' + sy + '" x2="' + ex + '" y2="' + ey + '" stroke="#fff" stroke-width="' + (width || 1.5) + '" marker-end="url(#ah)" opacity="' + (opacity || 0.6) + '"/>';
            }

            [r1, r2, r3, r4, r5, r6].forEach(function(r) {
                arrowFromTo(cx, cy, r.left + r.width / 2, r.top + r.height / 2, {width: avRect.width, height: avRect.height}, {width: r.width, height: r.height});
            });

            svg.innerHTML = defs + lines;
        }
        drawArrows();
        window.addEventListener('resize', drawArrows);

        function createParticles() {
            var container = document.getElementById('particles');
            container.innerHTML = '';
            for (var i = 0; i < 60; i++) {
                var p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.top = Math.random() * 100 + '%';
                p.style.animationDuration = (Math.random() * 4 + 3) + 's';
                p.style.animationDelay = (Math.random() * 3) + 's';
                var size = Math.random() * 3 + 1;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                container.appendChild(p);
            }
        }
        createParticles();

        window.openAuthModal = function() {
            document.getElementById('authOverlay').classList.add('active');
        };
        window.closeAuthModal = function() {
            document.getElementById('authOverlay').classList.remove('active');
            document.getElementById('authError').textContent = '';
        };

        window.openRobloxModal = function() {
            var overlay = document.getElementById('robloxOverlay');
            overlay.classList.add('active');
            var input = document.getElementById('robloxIdInput');
            input.value = window._savedRobloxId || '';
            input.focus();
        };
        window.closeRobloxModal = function() {
            document.getElementById('robloxOverlay').classList.remove('active');
        };
        window._savedRobloxId = '';

        async function fetchRobloxAvatar(username) {
            try {
                var resp = await fetch('https://api.roblox.com/users/get-by-username?username=' + encodeURIComponent(username));
                var json = await resp.json();
                if (json.Id) {
                    var thumb = await fetch('https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=' + json.Id + '&size=150x150&format=Png&isCircular=false');
                    var tjson = await thumb.json();
                    if (tjson.data && tjson.data[0] && tjson.data[0].imageUrl) {
                        return { avatarUrl: tjson.data[0].imageUrl, userId: json.Id, username: json.Username };
                    }
                    return { avatarUrl: '', userId: json.Id, username: json.Username };
                }
            } catch(e) {}
            return null;
        }

        window.saveRobloxId = async function() {
            var input = document.getElementById('robloxIdInput');
            var val = input.value.trim();
            if (!val) { input.style.borderColor = '#c62828'; return; }
            input.style.borderColor = '#555';
            var result = await fetchRobloxAvatar(val);
            if (!result) { input.style.borderColor = '#c62828'; return; }
            input.style.borderColor = '#555';
            document.getElementById('avatar').src = result.avatarUrl || 'https://tr.rbxcdn.com/30DAY-AvatarHeadshot-1507DAB190B8A3C9CEA7A26EE1A69D31-Png/420/420/AvatarHeadshot/Png/noFilter';
            window._savedRobloxId = result.username;
            closeRobloxModal();
            if (window.checkbfAuth && window.checkbfAuth.user) {
                window.checkbfAuth.saveToDB('profile', { robloxId: result.username, avatarUrl: result.avatarUrl || '' });
            }
        };

        async function loadRobloxProfile() {
            if (!window.checkbfAuth || !window.checkbfAuth.user) return;
            var data = await window.checkbfAuth.loadFromDB('profile');
            if (data && data.robloxId) {
                window._savedRobloxId = data.robloxId;
                if (data.avatarUrl) {
                    document.getElementById('avatar').src = data.avatarUrl;
                } else {
                    var result = await fetchRobloxAvatar(data.robloxId);
                    if (result && result.avatarUrl) document.getElementById('avatar').src = result.avatarUrl;
                }
            }
        }
    </script>
    <script>
        var firebaseConfig = {
            apiKey: "AIzaSyC10fTA0O6vpghuEanI52Yiyrtlkpmd8Nc",
            authDomain: "checkbf-d1a2d.firebaseapp.com",
            projectId: "checkbf-d1a2d",
            storageBucket: "checkbf-d1a2d.firebasestorage.app",
            messagingSenderId: "79682535947",
            appId: "1:79682535947:web:714e3f81408d7a0d0dbd0e"
        };
        firebase.initializeApp(firebaseConfig);
        var auth = firebase.auth();
        var db = firebase.firestore();
        var googleProvider = new firebase.auth.GoogleAuthProvider();

        var isRegisterMode = false;

        window.toggleAuthMode = function() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('authTitle').textContent = isRegisterMode ? 'Регистрация' : 'Вход';
            document.getElementById('authSubmit').textContent = isRegisterMode ? 'Зарегистрироваться' : 'Войти';
            document.getElementById('authSwitch').textContent = isRegisterMode ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Регистрация';
            document.getElementById('authError').textContent = '';
        };

        window.handleAuth = function() {
            var email = document.getElementById('authEmail').value.trim();
            var pass = document.getElementById('authPass').value;
            var errEl = document.getElementById('authError');
            errEl.textContent = '';
            if (!email || !pass) { errEl.textContent = 'Заполните все поля'; return; }
            var method = isRegisterMode
                ? auth.createUserWithEmailAndPassword(email, pass)
                : auth.signInWithEmailAndPassword(email, pass);
            method.then(function() {
                document.getElementById('authOverlay').classList.remove('active');
            }).catch(function(e) {
                var msg = e.code === 'auth/email-already-in-use' ? 'Email уже зарегистрирован' :
                          e.code === 'auth/wrong-password' ? 'Неверный пароль' :
                          e.code === 'auth/user-not-found' ? 'Пользователь не найден' :
                          e.code === 'auth/weak-password' ? 'Пароль минимум 6 символов' :
                          e.code === 'auth/invalid-email' ? 'Некорректный email' :
                          'Ошибка: ' + e.message;
                errEl.textContent = msg;
            });
        };

        window.handleGoogleAuth = function() {
            auth.signInWithPopup(googleProvider).then(function() {
                document.getElementById('authOverlay').classList.remove('active');
            }).catch(function(e) {
                document.getElementById('authError').textContent = 'Ошибка Google: ' + e.message;
            });
        };

        auth.getRedirectResult().then(function(result) {
            if (result && result.user) {
                document.getElementById('authOverlay').classList.remove('active');
            }
        }).catch(function(e) {
            if (e.code && e.code !== 'auth/no-redirect-result') {
                var errEl = document.getElementById('authError');
                if (errEl) errEl.textContent = 'Ошибка: ' + e.message;
            }
        });

        function updateAuthBar(user) {
            var bar = document.getElementById('authBar');
            if (user) {
                var photo = user.photoURL || 'https://tr.rbxcdn.com/30DAY-AvatarHeadshot-1507DAB190B8A3C9CEA7A26EE1A69D31-Png/420/420/AvatarHeadshot/Png/noFilter';
                bar.innerHTML = '<div class="user-info"><img src="' + photo + '" alt=""><span class="email">' + (user.email || 'Google') + '</span></div>' +
                    '<button class="logout-btn" onclick="auth.signOut()">Выйти</button>';
            } else {
                bar.innerHTML = '<button class="login-btn" onclick="openAuthModal()">Войти</button>';
            }
        }

        auth.onAuthStateChanged(function(user) {
            updateAuthBar(user);
            if (user) loadRobloxProfile();
        });
    </script>
</body>
</html>
