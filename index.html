<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CheckBF</title>
    <script src="lib/firebase-app-compat.js"></script>
    <script src="lib/firebase-auth-compat.js"></script>
    <script src="lib/firebase-firestore-compat.js"></script>
    <script src="js/auth.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
        }
        body {
            min-height: 100vh;
            background-color: #1a1a1a;
            background-image: url('assets/background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #c900c9;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.3s;
        }
        body.gradient-bg {
            background: linear-gradient(135deg, #0a0a0a 0%, #2d1b4e 30%, #1a0a2e 60%, #0a0a0a 100%);
        }
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle ease-in-out infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.1; transform: translateY(0); }
            50% { opacity: 0.8; transform: translateY(-20px); }
        }
        .logo {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            z-index: 15;
            pointer-events: none;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 800px;
            margin-top: 140px;
            z-index: 10;
        }
        .menu-btn {
            display: flex;
            align-items: center;
            gap: 16px;
            background: #2a2a3a;
            border: 1px solid #555;
            border-radius: 16px;
            padding: 20px 24px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .menu-btn:hover {
            background: #33334a;
            border-color: #8cf;
        }
        .menu-btn.dim {
            background: #1f1f2a;
            border-color: #3a3a4a;
            opacity: 0.5;
            cursor: default;
        }
        .menu-btn.dim:hover {
            background: #1f1f2a;
            border-color: #3a3a4a;
        }
        .menu-btn img {
            width: 52px;
            height: 52px;
            border-radius: 10px;
            flex-shrink: 0;
        }
        .menu-btn span {
            font-size: 1.1rem;
            color: #8cf;
            font-weight: 600;
        }
        .menu-btn.dim span {
            color: #666;
        }
        .menu-btn.full-width {
            grid-column: 1 / -1;
        }
        .auth-bar {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .auth-bar .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #2a2a3a;
            border: 1px solid #555;
            border-radius: 10px;
            padding: 6px 14px;
            color: #ccc;
            font-size: 0.8rem;
        }
        .auth-bar .user-info img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
        }
        .auth-bar .user-info .email {
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .auth-bar .logout-btn {
            background: none;
            border: 1px solid #c62828;
            color: #c62828;
            border-radius: 6px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 0.75rem;
        }
        .auth-bar .logout-btn:hover {
            background: #c62828;
            color: #fff;
        }
        .auth-bar .login-btn {
            background: #2a2a3a;
            border: 1px solid #555;
            border-radius: 10px;
            padding: 8px 18px;
            color: #8cf;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .auth-bar .login-btn:hover {
            background: #33334a;
            border-color: #8cf;
        }
        .auth-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 50;
            justify-content: center;
            align-items: center;
        }
        .auth-overlay.active {
            display: flex;
        }
        .auth-modal {
            background: #1e1e2e;
            border: 1px solid #555;
            border-radius: 16px;
            padding: 30px;
            width: 340px;
            text-align: center;
        }
        .auth-modal h2 {
            color: #8cf;
            margin: 0 0 20px;
            font-size: 1.3rem;
        }
        .auth-modal input {
            width: 100%;
            padding: 10px 14px;
            margin-bottom: 12px;
            border: 1px solid #555;
            border-radius: 8px;
            background: #2a2a3a;
            color: #fff;
            font-size: 0.9rem;
            box-sizing: border-box;
        }
        .auth-modal input:focus {
            outline: none;
            border-color: #8cf;
        }
        .auth-modal .auth-submit {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #5c6bc0;
            color: #fff;
            font-size: 0.9rem;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .auth-modal .auth-submit:hover {
            background: #7986cb;
        }
        .auth-modal .google-btn {
            width: 100%;
            padding: 10px;
            border: 1px solid #555;
            border-radius: 8px;
            background: #2a2a3a;
            color: #ccc;
            font-size: 0.9rem;
            cursor: pointer;
            margin-bottom: 12px;
        }
        .auth-modal .google-btn:hover {
            background: #33334a;
            border-color: #8cf;
        }
        .auth-modal .switch-link {
            color: #8cf;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .auth-modal .error-msg {
            color: #c62828;
            font-size: 0.8rem;
            margin-bottom: 10px;
            min-height: 1.2em;
        }
        .sync-indicator {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2a2a3a;
            border: 1px solid #43a047;
            border-radius: 10px;
            padding: 8px 14px;
            color: #43a047;
            font-size: 0.75rem;
            z-index: 30;
            transition: opacity 0.3s;
        }
        .sync-indicator.active {
            display: block;
        }

    </style>
</head>
<body class="gradient-bg">
    <div class="particles" id="particles"></div>
    <div class="auth-bar" id="authBar">
        <button class="login-btn" id="loginBtn" onclick="openAuthModal()">Войти</button>
    </div>
    <div class="auth-overlay" id="authOverlay">
        <div class="auth-modal">
            <h2 id="authTitle">Вход</h2>
            <div class="error-msg" id="authError"></div>
            <input type="email" id="authEmail" placeholder="Email" autocomplete="off">
            <input type="password" id="authPass" placeholder="Пароль" autocomplete="new-password">
            <button class="auth-submit" id="authSubmit" onclick="handleAuth()">Войти</button>
            <button class="google-btn" onclick="handleGoogleAuth()">Войти через Google</button>
            <span class="switch-link" id="authSwitch" onclick="toggleAuthMode()">Нет аккаунта? Регистрация</span>
            <br><br>
            <span class="switch-link" onclick="closeAuthModal()">Позже</span>
        </div>
    </div>
    <div class="sync-indicator" id="syncIndicator">Синхронизация...</div>
    <img class="logo" src="assets/logo.png" alt="CheckBF">
    <div class="grid">
        <div class="menu-btn dim full-width">
            <img src="assets/materials/Stone.webp" alt="">
            <span>Общее</span>
        </div>
        <div class="menu-btn" onclick="location.href='fruit.html'">
            <img src="assets/fruits/FlameB.webp" alt="">
            <span>Фрукты</span>
        </div>
        <div class="menu-btn" onclick="location.href='skins.html'">
            <img src="assets/skins/Red_Lightning_Fruit.webp" alt="">
            <span>Скины</span>
        </div>
        <div class="menu-btn" onclick="location.href='mutations.html'">
            <img src="assets/mutations/Empyrean_Fruit.webp" alt="">
            <span>Мутации</span>
        </div>
        <div class="menu-btn" onclick="location.href='rods.html'">
            <img src="assets/rods/GoldRodQ.webp" alt="">
            <span>Удочки</span>
        </div>
        <div class="menu-btn dim">
            <img src="assets/materials/DarkFragmentA.webp" alt="">
            <span>Рыбы</span>
        </div>
        <div class="menu-btn" onclick="location.href='fightingstyles.html'">
            <img src="assets/fighting/GodhumanA.webp" alt="">
            <span>Стили боя</span>
        </div>
        <div class="menu-btn" onclick="location.href='accessories.html'">
            <img src="assets/accessories/ValkyrieHelmetQ.webp" alt="">
            <span>Аксессуары</span>
        </div>
        <div class="menu-btn" onclick="location.href='swords.html'">
            <img src="assets/swords/Dark_Blade.webp" alt="">
            <span>Мечи</span>
        </div>
        <div class="menu-btn" onclick="location.href='guns.html'">
            <img src="assets/guns/DragonstormQ.webp" alt="">
            <span>Оружие</span>
        </div>
        <div class="menu-btn" onclick="location.href='materials.html'">
            <img src="assets/materials/DarkFragmentA.webp" alt="">
            <span>Материалы</span>
        </div>
        <div class="menu-btn" onclick="location.href='races.html'">
            <img src="assets/races/HumanIcon.webp" alt="">
            <span>Расы</span>
        </div>
        <div class="menu-btn dim">
            <img src="assets/materials/Stone.webp" alt="">
            <span>Титулы</span>
        </div>
    </div>
    <script>
        function createParticles() {
            var container = document.getElementById('particles');
            container.innerHTML = '';
            for (var i = 0; i < 60; i++) {
                var p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.top = Math.random() * 100 + '%';
                p.style.animationDuration = (Math.random() * 4 + 3) + 's';
                p.style.animationDelay = (Math.random() * 3) + 's';
                var size = Math.random() * 3 + 1;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                container.appendChild(p);
            }
        }
        createParticles();

        window.openAuthModal = function() {
            document.getElementById('authOverlay').classList.add('active');
        };
        window.closeAuthModal = function() {
            document.getElementById('authOverlay').classList.remove('active');
            document.getElementById('authError').textContent = '';
        };


    </script>
    <script>
        var firebaseConfig = {
            apiKey: "AIzaSyC10fTA0O6vpghuEanI52Yiyrtlkpmd8Nc",
            authDomain: "checkbf-d1a2d.firebaseapp.com",
            projectId: "checkbf-d1a2d",
            storageBucket: "checkbf-d1a2d.firebasestorage.app",
            messagingSenderId: "79682535947",
            appId: "1:79682535947:web:714e3f81408d7a0d0dbd0e"
        };
        firebase.initializeApp(firebaseConfig);
        var auth = firebase.auth();
        var db = firebase.firestore();
        var googleProvider = new firebase.auth.GoogleAuthProvider();

        var isRegisterMode = false;

        window.toggleAuthMode = function() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('authTitle').textContent = isRegisterMode ? 'Регистрация' : 'Вход';
            document.getElementById('authSubmit').textContent = isRegisterMode ? 'Зарегистрироваться' : 'Войти';
            document.getElementById('authSwitch').textContent = isRegisterMode ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Регистрация';
            document.getElementById('authError').textContent = '';
        };

        window.handleAuth = function() {
            var email = document.getElementById('authEmail').value.trim();
            var pass = document.getElementById('authPass').value;
            var errEl = document.getElementById('authError');
            errEl.textContent = '';
            if (!email || !pass) { errEl.textContent = 'Заполните все поля'; return; }
            if (email === 'test' && pass === 'test') {
                window.checkbfAuth.enterTestMode();
                document.getElementById('authOverlay').classList.remove('active');
                return;
            }
            var method = isRegisterMode
                ? auth.createUserWithEmailAndPassword(email, pass)
                : auth.signInWithEmailAndPassword(email, pass);
            method.then(function() {
                document.getElementById('authOverlay').classList.remove('active');
            }).catch(function(e) {
                var msg = e.code === 'auth/email-already-in-use' ? 'Email уже зарегистрирован' :
                          e.code === 'auth/wrong-password' ? 'Неверный пароль' :
                          e.code === 'auth/user-not-found' ? 'Пользователь не найден' :
                          e.code === 'auth/weak-password' ? 'Пароль минимум 6 символов' :
                          e.code === 'auth/invalid-email' ? 'Некорректный email' :
                          'Ошибка: ' + e.message;
                errEl.textContent = msg;
            });
        };

        window.handleGoogleAuth = function() {
            auth.signInWithPopup(googleProvider).then(function() {
                document.getElementById('authOverlay').classList.remove('active');
            }).catch(function(e) {
                document.getElementById('authError').textContent = 'Ошибка Google: ' + e.message;
            });
        };

        auth.getRedirectResult().then(function(result) {
            if (result && result.user) {
                document.getElementById('authOverlay').classList.remove('active');
            }
        }).catch(function(e) {
            if (e.code && e.code !== 'auth/no-redirect-result') {
                var errEl = document.getElementById('authError');
                if (errEl) errEl.textContent = 'Ошибка: ' + e.message;
            }
        });

        function updateAuthBar(user) {
            var bar = document.getElementById('authBar');
            if (user) {
                var photo = user.photoURL || '';
                bar.innerHTML = '<div class="user-info"><img src="' + photo + '" alt=""><span class="email">' + (user.email || 'Google') + '</span></div>' +
                    '<button class="logout-btn" onclick="doLogout()">Выйти</button>';
            } else {
                bar.innerHTML = '<button class="login-btn" onclick="openAuthModal()">Войти</button>';
            }
        }

        function doLogout() {
            if (window.checkbfAuth && window.checkbfAuth.testMode) {
                window.checkbfAuth.logout().then(function() {
                    updateAuthBar(null);
                });
            } else {
                auth.signOut();
            }
        }

        auth.onAuthStateChanged(function(user) {
            if (window.checkbfAuth && window.checkbfAuth.testMode) return;
            updateAuthBar(user);
        });

        window.checkbfAuth.onAuthChange(function(user) {
            if (!window.checkbfAuth.testMode) return;
            updateAuthBar(user);
        });

        if (window.checkbfAuth.testMode) {
            updateAuthBar(window.checkbfAuth.user);
        }
    </script>
</body>
</html>
