        html, body {

            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
        }
        body.gradient-bg::before {
            background: linear-gradient(135deg, #0a0a0a 0%, #2d1b4e 30%, #1a0a2e 60%, #0a0a0a 100%);

        body.gradient-bg {

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle ease-in-out infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.1; transform: translateY(0); }
            50% { opacity: 0.8; transform: translateY(-20px); }
        }
        .back {
            position: fixed;
            top: 20px;
            left: 20px;

            text-decoration: none;
            font-size: 1rem;

            border-radius: 16px;
            padding: 6px 16px;

            z-index: 20;
        }

            background: #33334a;
        }
        h1 {

            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            flex-shrink: 0;
        }

            font-size: 1rem;
            background: #2a2a3a;
            border: 1px solid #555;
            border-radius: 10px;
            padding: 8px 16px;

            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .main {

        function requireAuth() {
            if (window.checkbfAuth && window.checkbfAuth.requireAuth) return window.checkbfAuth.requireAuth();
            return false;
        }

        var owned = {};
        var currentCat = '';

        function loadData() {
            var raw = localStorage.getItem('checkbf_skins');
            if (raw) {
                var parsed = JSON.parse(raw);
                if (parsed && Object.keys(parsed).length > 0 && Object.keys(parsed)[0].indexOf(':') === -1) {
                    localStorage.removeItem('checkbf_skins');
                } else {
                    owned = parsed;
                }
            }
        }

        function saveData() {
            localStorage.setItem('checkbf_skins', JSON.stringify(owned));
            if (window.checkbfAuth && window.checkbfAuth.user) {
                TB.showSync();
                window.checkbfAuth.saveToDB('skins', owned).then(TB.hideSync);
            }
        }

        function renderCategories() {
            var container = document.getElementById('categoriesView');
            container.innerHTML = '';
            var keys = Object.keys(categories);
            keys.sort(function(a, b) {
                return categories[b].skins.length - categories[a].skins.length;
            });
            keys.forEach(function(key) {
                var cat = categories[key];
                var total = cat.skins.filter(function(s) { return disabledSkins.indexOf(key + ':' + s.name) === -1; }).length;
                var ownedCount = cat.skins.filter(function(s) { return disabledSkins.indexOf(key + ':' + s.name) === -1 && owned[key + ':' + s.name]; }).length;
                var isComplete = total > 0 && ownedCount === total;
                var div = document.createElement('div');
                div.className = 'cat-card' + (isComplete ? ' completed' : '');
                div.onclick = function() { openCategory(key); };
                div.innerHTML = '<img class="icon" src="' + catIcons[key] + '" alt="' + cat.name + '">' +
                    '<h3>' + cat.name + '</h3>' +
                    '<span class="count">' + ownedCount + '/' + total + '</span>';
                container.appendChild(div);
            });
        }

        function openCategory(key) {
            currentCat = key;
            document.getElementById('categoriesView').style.display = 'none';
            document.getElementById('subView').classList.add('active');
            document.getElementById('subTitle').textContent = categories[key].name;
            if (hasActiveFilter()) {
                renderSubSkins();
            } else {
                renderSubSkins();
            }
        }

        function backToCategories() {
            currentCat = '';
            document.getElementById('subView').classList.remove('active');
            document.getElementById('searchResults').classList.remove('active');
            document.getElementById('searchInput').value = '';
            if (hasActiveFilter()) {
                categoriesView = document.getElementById('categoriesView');
                categoriesView.style.display = 'none';
                document.getElementById('searchResults').classList.add('active');
                renderGlobalFilterResults();
            } else {
                document.getElementById('categoriesView').style.display = '';
                renderCategories();
            }
        }

        function hasActiveFilter() {
            return CBF.getFilterState('owned') !== 0 || CBF.getFilterState('recipe') !== 0 || CBF.getFilterState('seasonal') !== 0 || CBF.getFilterState('disabled') !== 0;
        }
        function applySkinFilter() {
            var ownedState = CBF.getFilterState('owned');
            var categoriesView = document.getElementById('categoriesView');
            var subView = document.getElementById('subView');
            var searchResults = document.getElementById('searchResults');
            var searchList = document.getElementById('searchList');

            if (!hasActiveFilter()) {
                searchResults.classList.remove('active');
                if (currentCat) {
                    subView.classList.add('active');
                    categoriesView.style.display = 'none';
                    renderSubSkins();
                } else {
                    categoriesView.style.display = '';
                    subView.classList.remove('active');
                    renderCategories();
                }
                return;
            }

            if (currentCat) {
                subView.classList.add('active');
                categoriesView.style.display = 'none';
                searchResults.classList.remove('active');
                renderSubSkins();
            } else {
                categoriesView.style.display = 'none';
                subView.classList.remove('active');
                searchResults.classList.add('active');
                searchList.innerHTML = '';
                renderGlobalFilterResults();
            }
        }

        function renderGlobalFilterResults() {
            var ownedState = CBF.getFilterState('owned');
            var recipeState = CBF.getFilterState('recipe');
            var seasonalState = CBF.getFilterState('seasonal');
            var disabledState = CBF.getFilterState('disabled');
            var searchList = document.getElementById('searchList');
            Object.keys(categories).forEach(function(key) {
                var cat = categories[key];
                var isDouble = cat.double;
                cat.skins.forEach(function(skin) {
                    var owKey = key + ':' + skin.name;
                    var isOwned = owned[owKey] === true;
                    if (ownedState === 1 && !isOwned) return;
                    if (ownedState === -1 && isOwned) return;
                    var hasRecipe = (hasRecipeSkins[key] || []).indexOf(skin.name) !== -1;
                    var recipeOwned = owned[owKey + '_recipe'] === true;
                    if (recipeState === 1 && !hasRecipe) return;
                    if (recipeState === -1 && hasRecipe) return;
                    var isSeasonal = skin.seasonal === true;
                    if (seasonalState === 1 && !isSeasonal) return;
                    if (seasonalState === -1 && isSeasonal) return;
                    var isDisabled = disabledSkins.indexOf(key + ':' + skin.name) !== -1;
                    if (disabledState === 1 && !isDisabled) return;
                    if (disabledState === -1 && isDisabled) return;
                    var div = document.createElement('div');
                    div.className = 'item skin-item' + (isOwned ? ' owned' : '');
                    div.dataset.name = skin.name;
                    div.dataset.owned = isOwned ? 'true' : 'false';
                    div.dataset.recipe = hasRecipe ? 'true' : 'false';
                    div.dataset.seasonal = skin.seasonal ? 'true' : 'false';
                    div.dataset.disabled = isDisabled ? 'true' : 'false';
                    var imgHtml = '';
                    if (isDouble && skin.img1) {
                        imgHtml = '<div class="double-img"><img src="' + skin.img1 + '" alt="' + skin.name + '" onerror="this.style.display=\'none\'"><img src="' + skin.img2 + '" alt="' + skin.name + '" onerror="this.style.display=\'none\'"></div>';
                    } else {
                        imgHtml = '<img src="' + skin.img + '" alt="' + skin.name + '" onerror="this.style.display=\'none\'">';
                    }
                    var btns = '';
                    if (isDisabled) {
                        btns = '<button class="own-btn disabled" disabled>Недоступен</button>';
                    } else if (hasRecipe) {
                        btns = '<div class="btn-row">' +
                            '<button class="recipe-btn' + (recipeOwned ? ' has-recipe' : '') + '" onclick="toggleRecipe(event, \'' + owKey + '\')">' + (recipeOwned ? '✓ Рецепт' : 'Рецепт') + '</button>' +
                            '<button class="own-btn' + (isOwned ? ' owned' : '') + '" onclick="toggleOwn(event, \'' + owKey + '\')">' + (isOwned ? '✓ Есть' : 'Есть?') + '</button>' +
                            '</div>';
                    } else {
                        btns = '<button class="own-btn' + (isOwned ? ' owned' : '') + '" onclick="toggleOwn(event, \'' + owKey + '\')">' + (isOwned ? '✓ Есть' : 'Есть?') + '</button>';
                    }
                    var seasonalHtml = skin.seasonal ? '<span class="seasonal">?<span class="tooltip">Это сезонный предмет, который невозможно получить в обычное время</span></span>' : '';
                    div.innerHTML = seasonalHtml + '<span class="cat-label">' + cat.name + '</span>' + imgHtml + '<h3>' + skin.name + '</h3>' + btns;
                    searchList.appendChild(div);
                });
            });
            initSeasonalTooltips();
        }

        var hasRecipeSkins = {
            aura: ["Апельсиновая Сода", "Яркий Жёлтый", "Солнечный Жёлтый", "Слаймовый Зелёный", "Зелёная Ящерица", "Синие Джинсы", "Пухлый Фиолетовый", "Огненная Роза", "Волна Тепла", "Абсолютный Ноль", "Снежный Белый", "Чистый Красный", "Зимнее Небо", "Дракон"],
            kitsune: [],
            dragon: ["Оранжевый", "Жёлтый", "Синий", "Красный", "Фиолетовый", "Чёрный", "Замороженный", "Изумрудный"],
            pain: [],
            lightning: [],
            portal: [],
            diamond: [],
            eagle: ["Бархат", "Сокол", "Золотой Мох", "Синее Небо", "Оранжевый Крем"],
            bomb: [],
            darkblade: []
        };
        var disabledSkins = ["aura:Хакер", "lightning:Белый", "dragon:Лиловая Ночь", "dragon:Небесный Феникс", "dragon:Кровавая Луна", "portal:Розовый", "portal:Оранжевый"];

        function renderSubSkins() {
            var list = document.getElementById('subList');
            list.innerHTML = '';
            var skins = categories[currentCat].skins;
            var isDouble = categories[currentCat].double;
            skins.forEach(function(skin) {
                var owKey = currentCat + ':' + skin.name;
                var isOwned = owned[owKey] === true;
                var hasRecipe = (hasRecipeSkins[currentCat] || []).indexOf(skin.name) !== -1;
                var recipeOwned = owned[owKey + '_recipe'] === true;
                var isDisabled = disabledSkins.indexOf(currentCat + ':' + skin.name) !== -1;
                var ownedState = CBF.getFilterState('owned');
                if (ownedState === 1 && !isOwned) return;
                if (ownedState === -1 && isOwned) return;
                var div = document.createElement('div');
                div.className = 'item skin-item' + (isOwned ? ' owned' : '');
                div.dataset.name = skin.name;
                div.dataset.owned = isOwned ? 'true' : 'false';
                div.dataset.recipe = hasRecipe ? 'true' : 'false';
                div.dataset.seasonal = skin.seasonal ? 'true' : 'false';
                div.dataset.disabled = isDisabled ? 'true' : 'false';
                var imgHtml = '';
                if (isDouble && skin.img1) {
                    imgHtml = '<div class="double-img"><img src="' + skin.img1 + '" alt="' + skin.name + '" onerror="this.style.display=\'none\'"><img src="' + skin.img2 + '" alt="' + skin.name + '" onerror="this.style.display=\'none\'"></div>';
                } else {
                    imgHtml = '<img src="' + skin.img + '" alt="' + skin.name + '" onerror="this.style.display=\'none\'">';
                }
                var btns = '';
                if (isDisabled) {
                    btns = '<button class="own-btn disabled" disabled>Недоступен</button>';
                } else if (hasRecipe) {
                    btns = '<div class="btn-row">' +
                        '<button class="recipe-btn' + (recipeOwned ? ' has-recipe' : '') + '" onclick="toggleRecipe(event, \'' + owKey + '\')">' + (recipeOwned ? '✓ Рецепт' : 'Рецепт') + '</button>' +
                        '<button class="own-btn' + (isOwned ? ' owned' : '') + '" onclick="toggleOwn(event, \'' + owKey + '\')">' + (isOwned ? '✓ Есть' : 'Есть?') + '</button>' +
                        '</div>';
                } else {
                    btns = '<button class="own-btn' + (isOwned ? ' owned' : '') + '" onclick="toggleOwn(event, \'' + owKey + '\')">' + (isOwned ? '✓ Есть' : 'Есть?') + '</button>';
                }
                var seasonalHtml = skin.seasonal ? '<span class="seasonal">?<span class="tooltip">Это сезонный предмет, который невозможно получить в обычное время</span></span>' : '';
                div.innerHTML = seasonalHtml + imgHtml + '<h3>' + skin.name + '</h3>' + btns;
                list.appendChild(div);
            });
            initSeasonalTooltips();
        }

        function toggleOwn(e, name) {
            e.stopPropagation();
            if (!requireAuth()) return;
            owned[name] = !owned[name];
            if (owned[name]) {
                var parts = name.split(':');
                var catKey = parts[0];
                var skinName = parts.slice(1).join(':');
                if ((hasRecipeSkins[catKey] || []).indexOf(skinName) !== -1) {
                    owned[name + '_recipe'] = true;
                }
            }
            saveData();
            if (hasActiveFilter()) {
                applySkinFilter();
            } else if (currentCat) {
                renderSubSkins();
            }
        }

        function toggleRecipe(e, name) {
            e.stopPropagation();
            if (!requireAuth()) return;
            owned[name + '_recipe'] = !owned[name + '_recipe'];
            if (!owned[name + '_recipe'] && owned[name]) {
                owned[name] = false;
            }
            saveData();
            if (hasActiveFilter()) {
                applySkinFilter();
            } else if (currentCat) {
                renderSubSkins();
            }
        }

        function filterBySearch() {
            var q = document.getElementById('searchInput').value.toLowerCase();
            var searchResults = document.getElementById('searchResults');
            var searchList = document.getElementById('searchList');
            var categoriesView = document.getElementById('categoriesView');
            var subView = document.getElementById('subView');

            if (!q) {
                searchResults.classList.remove('active');
                if (currentCat) {
                    subView.classList.add('active');
                    categoriesView.style.display = 'none';
                } else {
                    categoriesView.style.display = '';
                }
                return;
            }

            categoriesView.style.display = 'none';
            subView.classList.remove('active');
            searchResults.classList.add('active');
            searchList.innerHTML = '';

            Object.keys(categories).forEach(function(key) {
                var cat = categories[key];
                var isDouble = cat.double;
                cat.skins.forEach(function(skin) {
                    if (skin.name.toLowerCase().indexOf(q) === -1) return;
                    var owKey = key + ':' + skin.name;
                    var isOwned = owned[owKey] === true;
                    var hasRecipe = (hasRecipeSkins[key] || []).indexOf(skin.name) !== -1;
                    var recipeOwned = owned[owKey + '_recipe'] === true;
                    var isDisabled = disabledSkins.indexOf(key + ':' + skin.name) !== -1;
                    var div = document.createElement('div');
                    div.className = 'item skin-item' + (isOwned ? ' owned' : '');
                    div.dataset.name = skin.name;
                    div.dataset.owned = isOwned ? 'true' : 'false';
                    div.dataset.recipe = hasRecipe ? 'true' : 'false';
                    div.dataset.seasonal = skin.seasonal ? 'true' : 'false';
                    div.dataset.disabled = isDisabled ? 'true' : 'false';
                    var imgHtml = '';
                    if (isDouble && skin.img1) {
                        imgHtml = '<div class="double-img"><img src="' + skin.img1 + '" alt="' + skin.name + '" onerror="this.style.display=\'none\'"><img src="' + skin.img2 + '" alt="' + skin.name + '" onerror="this.style.display=\'none\'"></div>';
                    } else {
                        imgHtml = '<img src="' + skin.img + '" alt="' + skin.name + '" onerror="this.style.display=\'none\'">';
                    }
                    var btns = '';
                    if (isDisabled) {
                        btns = '<button class="own-btn disabled" disabled>Недоступен</button>';
                    } else if (hasRecipe) {
                        btns = '<div class="btn-row">' +
                            '<button class="recipe-btn' + (recipeOwned ? ' has-recipe' : '') + '" onclick="toggleRecipe(event, \'' + owKey + '\')">' + (recipeOwned ? '✓ Рецепт' : 'Рецепт') + '</button>' +
                            '<button class="own-btn' + (isOwned ? ' owned' : '') + '" onclick="toggleOwn(event, \'' + owKey + '\')">' + (isOwned ? '✓ Есть' : 'Есть?') + '</button>' +
                            '</div>';
                    } else {
                        btns = '<button class="own-btn' + (isOwned ? ' owned' : '') + '" onclick="toggleOwn(event, \'' + owKey + '\')">' + (isOwned ? '✓ Есть' : 'Есть?') + '</button>';
                    }
                    var seasonalHtml = skin.seasonal ? '<span class="seasonal">?<span class="tooltip">Это сезонный предмет, который невозможно получить в обычное время</span></span>' : '';
                    div.innerHTML = seasonalHtml + '<span class="cat-label">' + cat.name + '</span>' + imgHtml + '<h3>' + skin.name + '</h3>' + btns;
                    searchList.appendChild(div);
                });
            });
            initSeasonalTooltips();
        }

        loadData();
        renderCategories();

        function createParticles() {
            var container = document.getElementById('particles');
            container.innerHTML = '';
            for (var i = 0; i < 60; i++) {
                var p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.top = Math.random() * 100 + '%';
                p.style.animationDuration = (Math.random() * 4 + 3) + 's';
                p.style.animationDelay = (Math.random() * 3) + 's';
                var size = Math.random() * 3 + 1;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                container.appendChild(p);
            }
        }
        createParticles();

        function resetToDefaults() {
            localStorage.removeItem('checkbf_skins');
            owned = {};
            renderCategories();
            if (currentCat) {
                currentCat = '';
                document.getElementById('categoriesView').style.display = '';
                document.getElementById('subView').classList.remove('active');
            }
        }

        async function syncFromDB() {
            if (!window.checkbfAuth || !window.checkbfAuth.user) return;
            var dbData = await window.checkbfAuth.loadFromDB('skins');
            var localData = null;
            var raw = localStorage.getItem('checkbf_skins');
            if (raw) {
                try { localData = JSON.parse(raw); } catch(e) {}
            }
            if (dbData && Object.keys(dbData).length > 0) {
                localStorage.setItem('checkbf_skins', JSON.stringify(dbData));
                owned = dbData;
                renderCategories();
                if (currentCat) renderSubSkins();
                TB.showSync();
            } else if (localData && Object.keys(localData).length > 0) {
                await window.checkbfAuth.saveToDB('skins', localData);
                owned = localData;
                TB.showSync();
            }
        }

        TB.init();

        function applyAllVisibility() {
            applySkinFilter();
            var ownedState = CBF.getFilterState('owned');
            var recipeState = CBF.getFilterState('recipe');
            var seasonalState = CBF.getFilterState('seasonal');
            var disabledState = CBF.getFilterState('disabled');
            document.querySelectorAll('.skin-item').forEach(function(item) {
                var showFilter = true;
                if (ownedState === 1 && item.dataset.owned !== 'true') showFilter = false;
                if (ownedState === -1 && item.dataset.owned === 'true') showFilter = false;
                if (recipeState === 1 && item.dataset.recipe !== 'true') showFilter = false;
                if (recipeState === -1 && item.dataset.recipe === 'true') showFilter = false;
                if (seasonalState === 1 && item.dataset.seasonal !== 'true') showFilter = false;
                if (seasonalState === -1 && item.dataset.seasonal === 'true') showFilter = false;
                if (disabledState === 1 && item.dataset.disabled !== 'true') showFilter = false;
                if (disabledState === -1 && item.dataset.disabled === 'true') showFilter = false;
                item.style.display = showFilter ? '' : 'none';
            });
        }
    </script>
    <div class="auth-overlay" id="authOverlay">
        <div class="auth-modal">
            <h2 id="authTitle">Вход</h2>
            <div class="error-msg" id="authError"></div>
            <input type="email" id="authEmail" placeholder="Email" autocomplete="off">
            <input type="password" id="authPass" placeholder="Пароль" autocomplete="new-password">
            <button class="auth-submit" id="authSubmit" onclick="handleAuth()">Войти</button>
            <button class="google-btn" onclick="handleGoogleAuth()">Войти через Google</button>
            <span class="switch-link" id="authSwitch" onclick="toggleAuthMode()">Нет аккаунта? Регистрация</span>
            <br><br>
            <span class="switch-link" onclick="closeAuthModal()">Позже</span>
        </div>
    </div>
    <script>
        var isRegisterMode = false;
        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('authTitle').textContent = isRegisterMode ? 'Регистрация' : 'Вход';
            document.getElementById('authSubmit').textContent = isRegisterMode ? 'Зарегистрироваться' : 'Войти';
            document.getElementById('authSwitch').textContent = isRegisterMode ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Регистрация';
            document.getElementById('authError').textContent = '';
        }
        function handleAuth() {
            var email = document.getElementById('authEmail').value.trim();
            var pass = document.getElementById('authPass').value;
            var errEl = document.getElementById('authError');
            errEl.textContent = '';
            if (!email || !pass) { errEl.textContent = 'Заполните все поля'; return; }
            if (email === 'test' && pass === 'test') {
                window.checkbfAuth.enterTestMode();
                closeAuthModal();
                return;
            }
            var a = firebase.auth();
            var method = isRegisterMode
                ? a.createUserWithEmailAndPassword(email, pass)
                : a.signInWithEmailAndPassword(email, pass);
            method.then(function() { closeAuthModal(); }).catch(function(e) {
                var msg = e.code === 'auth/email-already-in-use' ? 'Email уже зарегистрирован' :
                          e.code === 'auth/wrong-password' ? 'Неверный пароль' :
                          e.code === 'auth/user-not-found' ? 'Пользователь не найден' :
                          e.code === 'auth/weak-password' ? 'Пароль минимум 6 символов' :
                          e.code === 'auth/invalid-email' ? 'Некорректный email' :
                          'Ошибка: ' + e.message;
                errEl.textContent = msg;
            });
        }
        function handleGoogleAuth() {
            var a = firebase.auth();
            var p = new firebase.auth.GoogleAuthProvider();
            a.signInWithPopup(p).then(function() { closeAuthModal(); }).catch(function(e) {
                document.getElementById('authError').textContent = 'Ошибка Google: ' + e.message;
            });
        }
        function closeAuthModal() { document.getElementById('authOverlay').classList.remove('active'); document.getElementById('authError').textContent = ''; }

        function initSeasonalTooltips() {
            Cards.initTooltips();
        }
        initSeasonalTooltips();
    </script>
    <script>CBF.init('checkbf_skins_filters');</script>
