<html lang="en">
<head>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background-color: #1a1a1a;
            color: #c900c9;
            font-family: 'Segoe UI', Arial, sans-serif;
            isolation: isolate;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
        }
        body.gradient-bg::before {
            background: linear-gradient(135deg, #0a0a0a 0%, #2d1b4e 30%, #1a0a2e 60%, #0a0a0a 100%);
            filter: none;
        }
        body.gradient-bg {
            background-color: transparent;
        }
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle ease-in-out infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.1; transform: translateY(0); }
            50% { opacity: 0.8; transform: translateY(-20px); }
        }
        .back {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #fff;
            text-decoration: none;
            font-size: 1rem;
            border: 1px solid #555;
            border-radius: 16px;
            padding: 6px 16px;
            background: #2a2a3a;
            z-index: 20;
        }
        .back:hover {
            background: #33334a;
        }
        h1 {
            font-size: 2.5rem;
            margin: 0;
            padding: 30px 0 20px 0;
            color: #fff;
            -webkit-text-stroke: 1px #000;
            text-align: center;
        }
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .search {
            width: 100%;
            max-width: 400px;
            padding: 8px 16px;
            border: 1px solid #555;
            border-radius: 20px;
            background: #2a2a3a;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }
        .search::placeholder {
            color: #777;
        }
        .search:focus {
            border-color: #8cf;
        }
        .categories {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            padding: 0 40px 40px 40px;
        }
        .cat-card {
            background: #2a2a3a;
            border: 1px solid #555;
            border-radius: 12px;
            padding: 20px 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .cat-card:hover {
            background: #33334a;
            transform: translateY(-3px);
            border-color: #8cf;
        }
        .cat-card.completed {
            border-color: #ffc107;
            box-shadow: 0 0 8px rgba(255,193,7,0.3);
        }
        .cat-card .icon {
            width: 64px;
            height: 64px;
            margin-bottom: 8px;
            border-radius: 8px;
            object-fit: cover;
        }
        .cat-card h3 {
            font-size: 1rem;
            font-weight: 600;
            margin: 0;
            color: #fff;
        }
        .cat-card .count {
            font-size: 0.75rem;
            color: #888;
            margin-top: 4px;
        }
        .subcategories {
            display: none;
            padding: 0 40px 40px 40px;
        }
        .subcategories.active {
            display: block;
        }
        .sub-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .sub-back {
            color: #fff;
            cursor: pointer;
            font-size: 1rem;
            background: #2a2a3a;
            border: 1px solid #555;
            border-radius: 10px;
            padding: 8px 16px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sub-back:hover {
            background: #33334a;
            border-color: #8cf;
        }
        .search-results {
            display: none;
            padding: 0 40px 40px 40px;
        }
        .search-results.active {
            display: block;
        }
        .search-results h2 {
            font-size: 1.3rem;
            color: #fff;
            margin: 0 0 12px 0;
        }
        .search-results .cat-label {
            font-size: 0.75rem;
            color: #8cf;
            margin-bottom: 4px;
        }
        .sub-header h2 {
            font-size: 1.5rem;
            margin: 0;
            color: #fff;
            -webkit-text-stroke: 0.5px #000;
        }
        .sub-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
        }
        .skin-item {
            background: #2a2a3a;
            border: 1px solid #555;
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .skin-item:hover {
            background: #33334a;
            transform: translateY(-2px);
        }
        .skin-item.owned {
            border-color: #4caf50;
            box-shadow: 0 0 8px rgba(76,175,80,0.3);
        }
        .skin-item img {
            width: 70px;
            height: 70px;
            border-radius: 8px;
            margin-bottom: 8px;
            object-fit: cover;
        }
        .skin-item h3 {
            font-size: 0.9rem;
            font-weight: 600;
            margin: 0 0 6px 0;
            color: #fff;
        }
        .own-btn {
            width: 100%;
            padding: 6px 0;
            border: 1px solid #555;
            border-radius: 6px;
            background: rgba(255,255,255,0.05);
            color: #888;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .own-btn:hover {
            background: rgba(255,255,255,0.1);
        }
        .own-btn.owned {
            background: #2e7d32;
            border-color: #4caf50;
            color: #fff;
        }
        .btn-row {
            display: flex;
            gap: 4px;
            width: 100%;
        }
        .btn-row .own-btn {
            flex: 1;
        }
        .btn-row .recipe-btn {
            flex: 1;
        }
        .recipe-btn {
            padding: 6px 0;
            border: 1px solid #555;
            border-radius: 6px;
            background: rgba(255,255,255,0.05);
            color: #888;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .recipe-btn:hover {
            background: rgba(255,255,255,0.1);
        }
        .recipe-btn.has-recipe {
            background: #1565c0;
            border-color: #42a5f5;
            color: #fff;
        }
        .own-btn.disabled {
            background: #333;
            border-color: #444;
            color: #666;
            cursor: not-allowed;
            opacity: 0.5;
        }
        .double-img {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
        }
        .double-img img {
            width: 48px;
            height: 48px;
            border-radius: 6px;
            object-fit: cover;
        }
        .auth-bar {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .auth-bar .user-info {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #2a2a3a;
            border: 1px solid #555;
            border-radius: 10px;
            padding: 5px 12px;
            color: #ccc;
            font-size: 0.75rem;
        }
        .auth-bar .user-info img {
            width: 24px;
            height: 24px;
            border-radius: 50%;
        }
        .auth-bar .logout-btn {
            background: none;
            border: 1px solid #c62828;
            color: #c62828;
            border-radius: 6px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 0.7rem;
        }
        .auth-bar .logout-btn:hover {
            background: #c62828;
            color: #fff;
        }
        .sync-indicator {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2a2a3a;
            border: 1px solid #43a047;
            border-radius: 10px;
            padding: 6px 12px;
            color: #43a047;
            font-size: 0.7rem;
            z-index: 30;
        }
        .sync-indicator.active { display: block; }
    </style>
</head>

        function requireAuth() {
            if (window.checkbfAuth && window.checkbfAuth.requireAuth) return requireAuth();
            if (typeof showAuthRequiredOverlay === 'function') { showAuthRequiredOverlay(); }
            else {
                var o = document.getElementById('authRequiredOverlay');
                if (!o) {
                    o = document.createElement('div');
                    o.id = 'authRequiredOverlay';
                    o.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);z-index:9999;display:flex;align-items:center;justify-content:center;';
                    o.innerHTML = '<div style="background:#1a1a2e;border:1px solid #555;border-radius:16px;padding:30px 40px;text-align:center;max-width:360px;"><h3 style="color:#fff;margin:0 0 12px;font-size:1.2rem;">Требуется авторизация</h3><p style="color:#aaa;margin:0 0 20px;font-size:0.9rem;">Войдите или зарегистрируйтесь, чтобы сохранять данные</p><a href="index.html" style="display:inline-block;background:#6a3fc9;color:#fff;border:none;border-radius:12px;padding:10px 30px;font-size:0.95rem;text-decoration:none;cursor:pointer;">Войти</a></div>';
                    document.body.appendChild(o);
                    o.addEventListener('click', function(e) { if (e.target === o) o.remove(); });
                }
            }
            return false;
        }

        var owned = {};
        var currentCat = '';

        function loadData() {
            var raw = localStorage.getItem('checkbf_skins');
            if (raw) {
                var parsed = JSON.parse(raw);
                if (parsed && Object.keys(parsed).length > 0 && Object.keys(parsed)[0].indexOf(':') === -1) {
                    localStorage.removeItem('checkbf_skins');
                } else {
                    owned = parsed;
                }
            }
        }

        function saveData() {
            localStorage.setItem('checkbf_skins', JSON.stringify(owned));
            if (window.checkbfAuth && window.checkbfAuth.user) {
                showSync();
                window.checkbfAuth.saveToDB('skins', owned).then(hideSync);
            }
        }

        function renderCategories() {
            var container = document.getElementById('categoriesView');
            container.innerHTML = '';
            var keys = Object.keys(categories);
            keys.sort(function(a, b) {
                return categories[b].skins.length - categories[a].skins.length;
            });
            keys.forEach(function(key) {
                var cat = categories[key];
                var total = cat.skins.filter(function(s) { return disabledSkins.indexOf(s.name) === -1; }).length;
                var ownedCount = cat.skins.filter(function(s) { return disabledSkins.indexOf(s.name) === -1 && owned[key + ':' + s.name]; }).length;
                var isComplete = total > 0 && ownedCount === total;
                var div = document.createElement('div');
                div.className = 'cat-card' + (isComplete ? ' completed' : '');
                div.onclick = function() { openCategory(key); };
                div.innerHTML = '<img class="icon" src="' + catIcons[key] + '" alt="' + cat.name + '">' +
                    '<h3>' + cat.name + '</h3>' +
                    '<span class="count">' + ownedCount + '/' + total + '</span>';
                container.appendChild(div);
            });
        }

        function openCategory(key) {
            currentCat = key;
            document.getElementById('categoriesView').style.display = 'none';
            document.getElementById('subView').classList.add('active');
            document.getElementById('subTitle').textContent = categories[key].name;
            renderSubSkins();
        }

        function backToCategories() {
            currentCat = '';
            document.getElementById('categoriesView').style.display = '';
            document.getElementById('subView').classList.remove('active');
            document.getElementById('searchResults').classList.remove('active');
            document.getElementById('searchInput').value = '';
            renderCategories();
        }

            pain: ["Хакер"],
            lightning: [],
            portal: [],
            diamond: ["Бархат"],
            eagle: ["Сокол", "Золотой Мох", "Синее Небо"],
            bomb: ["Оранжевый Крем"],
            tiger: ["Оранжевый", "Жёлтый", "Синий", "Красный", "Фиолетовый"],
            yeti: ["Чёрный", "Замороженный", "Изумрудный"]
        };
        var disabledSkins = ["Хакер", "Белый", "Лиловая Ночь", "Небесный Феникс", "Кровавая Луна"];

        function renderSubSkins() {
            var list = document.getElementById('subList');
            list.innerHTML = '';
            var skins = categories[currentCat].skins;
            var isDouble = categories[currentCat].double;
            skins.forEach(function(skin) {
                var owKey = currentCat + ':' + skin.name;
                var isOwned = owned[owKey] === true;
                var hasRecipe = (hasRecipeSkins[currentCat] || []).indexOf(skin.name) !== -1;
                var recipeOwned = owned[owKey + '_recipe'] === true;
                var isDisabled = disabledSkins.indexOf(skin.name) !== -1;
                var div = document.createElement('div');
                div.className = 'skin-item' + (isOwned ? ' owned' : '');
                div.dataset.name = skin.name;
                var imgHtml = '';
                if (isDouble && skin.img1) {
                    imgHtml = '<div class="double-img"><img src="' + skin.img1 + '" alt="' + skin.name + '" onerror="this.style.display=\'none\'"><img src="' + skin.img2 + '" alt="' + skin.name + '" onerror="this.style.display=\'none\'"></div>';
                } else {
                    imgHtml = '<img src="' + skin.img + '" alt="' + skin.name + '" onerror="this.style.display=\'none\'">';
                }
                var btns = '';
                if (isDisabled) {
                    btns = '<button class="own-btn disabled" disabled>Недоступен</button>';
                } else if (hasRecipe) {
                    btns = '<div class="btn-row">' +
                        '<button class="recipe-btn' + (recipeOwned ? ' has-recipe' : '') + '" onclick="toggleRecipe(event, \'' + owKey + '\')">' + (recipeOwned ? '✓ Рецепт' : 'Рецепт') + '</button>' +
                        '<button class="own-btn' + (isOwned ? ' owned' : '') + '" onclick="toggleOwn(event, \'' + owKey + '\')">' + (isOwned ? '✓ Есть' : 'Есть?') + '</button>' +
                        '</div>';
                } else {
                    btns = '<button class="own-btn' + (isOwned ? ' owned' : '') + '" onclick="toggleOwn(event, \'' + owKey + '\')">' + (isOwned ? '✓ Есть' : 'Есть?') + '</button>';
                }
                div.innerHTML = imgHtml + '<h3>' + skin.name + '</h3>' + btns;
                list.appendChild(div);
            });
        }

        function toggleOwn(e, name) {
            e.stopPropagation();
            if (!requireAuth()) return;
            owned[name] = !owned[name];
            saveData();
            if (currentCat) renderSubSkins();
        }

        function toggleRecipe(e, name) {
            e.stopPropagation();
            if (!requireAuth()) return;
            owned[name + '_recipe'] = !owned[name + '_recipe'];
            saveData();
            if (currentCat) renderSubSkins();
        }

        function filterBySearch() {
            var q = document.getElementById('searchInput').value.toLowerCase();
            var searchResults = document.getElementById('searchResults');
            var searchList = document.getElementById('searchList');
            var categoriesView = document.getElementById('categoriesView');
            var subView = document.getElementById('subView');

            if (!q) {
                searchResults.classList.remove('active');
                if (currentCat) {
                    subView.classList.add('active');
                    categoriesView.style.display = 'none';
                } else {
                    categoriesView.style.display = '';
                }
                return;
            }

            categoriesView.style.display = 'none';
            subView.classList.remove('active');
            searchResults.classList.add('active');
            searchList.innerHTML = '';

            Object.keys(categories).forEach(function(key) {
                var cat = categories[key];
                var isDouble = cat.double;
                cat.skins.forEach(function(skin) {
                    if (skin.name.toLowerCase().indexOf(q) === -1) return;
                    var owKey = key + ':' + skin.name;
                    var isOwned = owned[owKey] === true;
                    var hasRecipe = (hasRecipeSkins[key] || []).indexOf(skin.name) !== -1;
                    var recipeOwned = owned[owKey + '_recipe'] === true;
                    var isDisabled = disabledSkins.indexOf(skin.name) !== -1;
                    var div = document.createElement('div');
                    div.className = 'skin-item' + (isOwned ? ' owned' : '');
                    div.dataset.name = skin.name;
                    var imgHtml = '';
                    if (isDouble && skin.img1) {
                        imgHtml = '<div class="double-img"><img src="' + skin.img1 + '" alt="' + skin.name + '" onerror="this.style.display=\'none\'"><img src="' + skin.img2 + '" alt="' + skin.name + '" onerror="this.style.display=\'none\'"></div>';
                    } else {
                        imgHtml = '<img src="' + skin.img + '" alt="' + skin.name + '" onerror="this.style.display=\'none\'">';
                    }
                    var btns = '';
                    if (isDisabled) {
                        btns = '<button class="own-btn disabled" disabled>Недоступен</button>';
                    } else if (hasRecipe) {
                        btns = '<div class="btn-row">' +
                            '<button class="recipe-btn' + (recipeOwned ? ' has-recipe' : '') + '" onclick="toggleRecipe(event, \'' + owKey + '\')">' + (recipeOwned ? '✓ Рецепт' : 'Рецепт') + '</button>' +
                            '<button class="own-btn' + (isOwned ? ' owned' : '') + '" onclick="toggleOwn(event, \'' + owKey + '\')">' + (isOwned ? '✓ Есть' : 'Есть?') + '</button>' +
                            '</div>';
                    } else {
                        btns = '<button class="own-btn' + (isOwned ? ' owned' : '') + '" onclick="toggleOwn(event, \'' + owKey + '\')">' + (isOwned ? '✓ Есть' : 'Есть?') + '</button>';
                    }
                    div.innerHTML = '<span class="cat-label">' + cat.name + '</span>' + imgHtml + '<h3>' + skin.name + '</h3>' + btns;
                    searchList.appendChild(div);
                });
            });
        }

        renderCategories();

        function createParticles() {
            var container = document.getElementById('particles');
            container.innerHTML = '';
            for (var i = 0; i < 60; i++) {
                var p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.top = Math.random() * 100 + '%';
                p.style.animationDuration = (Math.random() * 4 + 3) + 's';
                p.style.animationDelay = (Math.random() * 3) + 's';
                var size = Math.random() * 3 + 1;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                container.appendChild(p);
            }
        }
        createParticles();

        function showSync() {
            var el = document.getElementById('syncIndicator');
            el.classList.add('active');
            setTimeout(function() { el.classList.remove('active'); }, 1500);
        }
        function hideSync() {
            document.getElementById('syncIndicator').classList.remove('active');
        }

        function resetToDefaults() {
            localStorage.removeItem('checkbf_skins');
            owned = {};
            renderCategories();
            if (currentCat) {
                currentCat = '';
                document.getElementById('categoriesView').style.display = '';
                document.getElementById('subView').classList.remove('active');
            }
        }

        function updateAuthBar(user) {
            var bar = document.getElementById('authBar');
            if (user) {
                var photo = user.photoURL || 'https://tr.rbxcdn.com/30DAY-AvatarHeadshot-1507DAB190B8A3C9CEA7A26EE1A69D31-Png/420/420/AvatarHeadshot/Png/noFilter';
                bar.innerHTML = '<div class="user-info"><img src="' + photo + '" alt=""><span>' + (user.email || 'Google') + '</span></div>' +
                    '<button class="logout-btn" id="logoutBtn">Выйти</button>';
                document.getElementById('logoutBtn').onclick = function() {
                    if (window.checkbfAuth) window.checkbfAuth.logout();
                };
            } else {
                bar.innerHTML = '<a class="back" href="index.html" style="position:static;font-size:0.75rem;">Войти</a>';
                resetToDefaults();
            }
        }

        async function syncFromDB() {
            if (!window.checkbfAuth || !window.checkbfAuth.user) return;
            var dbData = await window.checkbfAuth.loadFromDB('skins');
            if (dbData) {
                localStorage.setItem('checkbf_skins', JSON.stringify(dbData));
                owned = dbData;
                loadData();
                renderCategories();
                if (currentCat) {
                    renderSubSkins();
                }
                showSync();
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (window.checkbfAuth) {
                window.checkbfAuth.onAuthChange(function(user) {
                    updateAuthBar(user);
                    if (user) syncFromDB();
                });
            }
        });
    </script>
